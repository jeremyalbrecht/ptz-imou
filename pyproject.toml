[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "imou-ptz"
version = "0.1.0"
description = "ONVIF PTZ proxy for IMOU/Dahua cameras"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
imou-ptz = "imou_ptz.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["imou_ptz*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["imou_ptz"]

[dependency-groups]
dev = [
  "ruff>=0.4",
  "pytest>=8",
]

