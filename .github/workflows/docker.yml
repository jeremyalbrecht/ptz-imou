name: Docker - Build & Push
on:
  push:
    branches:
      - main
      - "feature/**"
    tags:
      - "v*.*.*"
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false
env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/imou-ptz
jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sanitise feature tag
        if: startsWith(github.ref, 'refs/heads/feature/')
        id: feature-tag
        run: |
          RAW="${GITHUB_REF#refs/heads/}"
          echo "TAG=${RAW//\//-}" >> "$GITHUB_OUTPUT"
      - name: Build & push to GHCR (feature)
        if: startsWith(github.ref, 'refs/heads/feature/')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.GHCR_IMAGE }}:${{ steps.feature-tag.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push to GHCR (:latest)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.GHCR_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Extract metadata (release tag)
        if: startsWith(github.ref, 'refs/tags/v')
        id: meta-release
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - name: Build & push to GHCR (versioned)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-release.outputs.tags }}
          labels: ${{ steps.meta-release.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
