name: Release

on:
  push:
    branches:
      - "release/**"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Tag & Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from branch name
        id: version
        run: |
          # Branch is release/X.Y.Z  →  tag v X.Y.Z
          BRANCH="${GITHUB_REF#refs/heads/release/}"
          echo "VERSION=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "TAG=v${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Check tag does not already exist
        run: |
          if git rev-parse "${{ steps.version.outputs.TAG }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.TAG }} already exists – skipping release creation."
            exit 0
          fi

      - name: Generate changelog from commits
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" "${PREVIOUS_TAG}..HEAD")
          fi
          # Export as multiline env var
          {
            echo "CHANGELOG<<EOF"
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create and push version tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.TAG }}" \
                  -m "Release ${{ steps.version.outputs.TAG }}"
          git push origin "${{ steps.version.outputs.TAG }}"

      - name: Trigger Docker build for release tag
        run: |
          gh workflow run docker.yml \
            --ref "${{ steps.version.outputs.TAG }}" \
            -f ref="refs/tags/${{ steps.version.outputs.TAG }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "Release ${{ steps.version.outputs.TAG }}"
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.CHANGELOG }}

            ---
            **GitHub Package (versioned):** `ghcr.io/${{ github.repository_owner }}/imou-ptz:${{ steps.version.outputs.VERSION }}`
            **GitHub Package (latest):** `ghcr.io/${{ github.repository_owner }}/imou-ptz:latest`
          draft: false
          prerelease: false
          generate_release_notes: false

